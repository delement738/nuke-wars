# Runs the same three checks you run locally, on GitHub's machines, for every
# pull request and every push to main. A red X on a PR means one of them failed:
# click "Details" next to it to see which step and why.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly what package-lock.json says, nothing newer.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `tsc -b` inside the build is the full type-check.
      - name: Build
        run: npm run build
